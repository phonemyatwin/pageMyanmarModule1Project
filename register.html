                <a href="#" class="logo__link">
                    <img src="images/logo.png" alt="Team Falcon" class="logo__img">
                </a>
            </div>
        </div>

        <div class="menu">
            <ul class="menu__list">
                <li class="menu__item">
                    <a href="index.html" class="menu__link">home</a>

            </ul>
        </div>
    </header>
    <!-- End of the header -->

    <!-- Start of the main -->
    <main>
        <h3 class="page_title">register</h3>

        <form class="form_container register">
            <div class="form_group">
                <input type="text" required placeholder="Enter your name" class="form_input">
                <input type="email" required placeholder="Enter your email" class="form_input">
            </div>
            <div class="form_group">
                <input type="password" required placeholder="Enter your password" class="form_input">
                <input type="password" required placeholder="Confirm your password" class="form_input">
            </div>
            <div class="form_group register">
                <input type="number" required placeholder="Enter your age" class="form_input">
                <input type="date" required class="form_input">
                <input type="file" required class="form_input">
            </div>
            <div class="form_group">
                <input type="number" required placeholder="Enter your phone number" class="form_input">
                <input type="text" required placeholder="Enter your NRC number" class="form_input">
            </div>
            <input type="text" required placeholder="Enter your address" class="form_input">
            <textarea required placeholder="Enter your biography" class="form_input textarea"></textarea>
            <div class="btn_group">
                <button class="btn" onclick="window.location.href='login.html'">go back to login</button>
                <button type="submit" class="btn">register</button>
            </div>
        </form>
    </main>
    <!-- End of the main -->

    <!-- Start of the footer -->

        <div class="footer__box">
            <h3 class="footer__title">quick Links</h3>

                <li class="footer__item">

        <div class="footer__box">
