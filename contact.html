<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <header>
        <div class="logo">
            <div class="logo__image">
                <a href="#" class="logo__link">
                    <img src="images/logo.png" alt="Team Falcon" class="logo__img">
                </a>
            </div>
        </div>

        <div class="menu">
            <ul class="menu__list">
                <li class="menu__item">
                    <a href="index.html" class="menu__link">home</a>
                </li>

                <li class="menu__item">
                    <a href="about.html" class="menu__link">about</a>
                </li>

                <li class="menu__item">
                    <a href="contact.html" class="menu__link active">contact</a>
                </li>

                <li class="menu__item">
                    <a href="shop.html" class="menu__link">shop</a>
                </li>
            </ul>
        </div>

        <div class="icon">
            <ul class="icon__list">
                <li class="icon__item">
                    <a href="#" class="icon__link"><i class="fa fa-user"></i></a>
                </li>

                <li class="icon__item">
                    <a href="#" class="icon__link"><i class="fa fa-heart"></i></a>
                </li>

                <li class="icon__item">
                    <a href="#" class="icon__link"><i class="fa fa-shopping-cart"></i></a>
                </li>
            </ul>
        </div>
    </header>

    <main>
        <h3 class="page_title">contact us</h3>
        <div class="card_container">
            <div class="card">
                <i class="fa fa-envelope"></i>
                <span>example.gmail.com</span>
            </div>
            <div class="card">
                <i class="fa fa-phone"></i>
                <span>09973383719</span>
            </div>
            <div class="card">
                <i class="fa fa-map"></i>
                <span>Times City, Yangon</span>
            </div>
            <div class="card">
                <i class="fab fa-telegram"></i>
                <span>09973383719</span>
            </div>
        </div>

        <div class="form_map">
            <form class="form_container">
                <div class="form_group">
                    <input type="text" placeholder="Enter your name" class="form_input">
                    <input type="email" placeholder="Enter your email" class="form_input">
                </div>
                <input type="text" placeholder="Enter your subject" class="form_input">
                <textarea placeholder="Enter your message" class="form_input textarea"></textarea>
                <button type="submit" class="btn">send message</button>
            </form>

            <div class="map_container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d61102.25189085846!2d96.132405!3d16.8317754!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30c1eb34335a92f5%3A0xea3210d0410309d7!2sTimes%20City%20Yangon!5e0!3m2!1sen!2smm!4v1788407056039!5m2!1sen!2smm"
                    allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>

    </main>

    <footer>
        <div class="footer__box">
            <h3 class="footer__title">quick Links</h3>
            <ul class="footer__list">
                <li class="footer__item">
                    <a href="index.html" class="footer__link"><i class="fa fa-chevron-right"></i>home</a>
                </li>
                <li class="footer__item">
                    <a href="about.html" class="footer__link"><i class="fa fa-chevron-right"></i>about</a>
                </li>
                <li class="footer__item">
                    <a href="contact.html" class="footer__link"><i class="fa fa-chevron-right"></i>contact</a>
                </li>
                <li class="footer__item">
                    <a href="shop.html" class="footer__link"><i class="fa fa-chevron-right"></i>shop</a>
                </li>
            </ul>
        </div>

        <div class="footer__box">
            <h3 class="footer__title">legal</h3>
            <ul class="footer__list">
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>FAQ</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>terms & conditions</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>privacy & policy</a>
                </li>
            </ul>
        </div>

        <div class="footer__box">
            <h3 class="footer__title">accounts</h3>
            <ul class="footer__list">
                <li class="footer__item">
                    <a href="login.html" class="footer__link"><i class="fa fa-chevron-right"></i>login</a>
                </li>
                <li class="footer__item">
                    <a href="register.html" class="footer__link"><i class="fa fa-chevron-right"></i>register</a>
                </li>
                <li class="footer__item">
                    <a href="account.html" class="footer__link"><i class="fa fa-chevron-right"></i>my account</a>
                </li>

            </ul>
        </div>

        <div class="footer__box">
            <h3 class="footer__title">follow us</h3>
            <ul class="footer__list social">
                <li class="footer__item">
                    <a href="#" class="footer__link facebook"><i class="fab fa-facebook"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link github"><i class="fab fa-github"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link instagram"><i class="fab fa-instagram"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link twitter"><i class="fab fa-twitter"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link telegram"><i class="fab fa-telegram"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link viber"><i class="fab fa-viber"></i></a>
                </li>
            </ul>
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
